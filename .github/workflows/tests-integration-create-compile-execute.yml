name: tests-integration-create-compile-execute

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  integration-app:
    name: Integration - ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php: ['8.4']
        test_name: [
          'compilation failed on second test',
          'compilation failed on first test',
          'three successful tests',
          'step failed'
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup image test environment
        run: |
          composer integration-setup
          sleep 5
          composer integration-chown-app-source

      - name: Run tests
        run: |
          ./vendor/bin/phpunit -c phpunit.integration.xml \
          tests/Integration/CreateCompileExecuteTest.php \
          filter=testCreateCompileExecute#"${{ matrix.test_name }}"
