framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            'App\Message\CompileSourceMessage': async
            'App\Message\ExecuteTestMessage': async
            'App\Message\TimeoutCheckMessage': async
            'App\Message\ExecutionCompletedCheckMessage': async
            'Symfony\Component\Webhook\Messenger\SendWebhookMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'

            routing:
                '*': async

when@integration:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'sync://'

                memory:
                    dsn: 'in-memory://'

            routing:
                'App\Message\ExecutionCompletedCheckMessage': memory
                'App\Message\TimeoutCheckMessage': memory
